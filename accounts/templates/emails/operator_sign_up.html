<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: "Google Sans", sans-serif;
            line-height: 1.6;
            color: #333333;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            {#text-align: center;#}
            color: #4CAF50;
        }

        .content {
            margin-top: 20px;
            margin-bottom: 100px;
            font-family: "Google Sans", sans-serif;
        }

        .footer {
            margin-top: 30px;
            {#text-align: center;#}
            color: grey;
            font-family: "Google Sans", sans-serif;
        }
        .footer-head {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .button {
            border: none;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://akors-frontend.s3.us-east-1.amazonaws.com/akors_logo.png" alt="logo" width="auto" height="100">
    </div>
    <div class="content">
        <p style="font-weight: bold; font-size: 16px">Thank You for signing up on AKORS!</p>
        <p>Your request has been sent to the admin. Please wait for admin’s approval.</p>

    </div>
    <div class="footer">
        <p class="footer-head">Team Hoist Cloud</p>
        <p style="margin-top: 0; padding-top: 0">support@hoistcloud.com</p>
    </div>
</div>
</body>
</html>
