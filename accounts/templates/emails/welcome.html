<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: "Google Sans", sans-serif;
            line-height: 1.6;
            color: #333333;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            color: #4CAF50;
        }

        .content {
            margin-top: 20px;
            font-family: "Google Sans", sans-serif;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: grey;
            font-family: "Google Sans", sans-serif;
        }

        .button {
            border: none;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://akors-frontend.s3.us-east-1.amazonaws.com/akors_logo.png" alt="logo" width="100" height="100">
    </div>
    <div class="content">
        <p>Dear {{ user.first_name }},</p>

        <p>Please click the button below to verify your email</p>
        <button type="button" class="button">
            <a href="{{ site }}/verify-email?token={{ token }}&user_id={{ user.id }}&type={{ type }}"
               style="text-decoration:none;color:#2954FF;">
                Verify email
            </a>
        </button>
    </div>
    <div class="footer">
        <p>Best Regards,</p>
        <p>Team Akors</p>
    </div>
</div>
</body>
</html>
